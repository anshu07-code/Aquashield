version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Bootstrap the whole npm workspace (installs @aquashield/types + risk-core)
        - npm ci
    build:
      commands:
        - cd apps/web && npm run build
  artifacts:
    # Static export output (`output: "export"` in next.config.mjs → plain out/ folder)
    baseDirectory: apps/web/out
    files:
      - "**/*"
  cache:
    paths:
      - apps/web/.next/cache/**
